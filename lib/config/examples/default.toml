[default]
retries = 5
retry_frequency = 10
frequency = 60
timeout = 1
notifiers = [ "mailer", ]
error_notifiers = []
priority = 3
envs = [
    "SNMP_COMMUNITY=public",
    "SNMP_VERSION=2c",
    "EMAIL_FROM=fz@example",
]

[[gate]]
name = "to_failed"
command = "gate/to_state"
args = ["fail"]

[[gate]]
name = "to_ok"
command = "gate/to_state"
args = ["ok"]

[[notifier]]
name = "mailer"
command = "notifier/email"
envs = [
    "EMAIL_ADDRESS=root@example",
]
timeout = 3
gates = [
    [ "to_fail" ],
    [ "to_ok" ],
]
